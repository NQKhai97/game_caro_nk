<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ Caro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
  --bg: #ffffff;
  --ink: #1b2340;
  --muted: #667089;
  --line: #e3e8f2;
  --hover: #f3f5fb;
  --brand: #4f46e5;
  --brand-soft: #eef0ff;
  --x: #e5383b;
  --x-soft: #fff0f0;
  --o: #2563eb;
  --o-soft: #edf3ff;
  --amber: #f59e0b;
  --grid-edge: #a9c2ec;
  --focus: #2f6fe0;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #fff; }
button { font-family: inherit; font-size: 0.95rem; cursor: pointer; color: inherit; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Header dính trên cùng */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding: 5px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.logo { display: flex; align-items: center; gap: 6px; min-width: 0; }
.name { font-family: "Patrick Hand", "Be Vietnam Pro", system-ui, sans-serif; font-size: 1.6rem; line-height: 1; white-space: nowrap; }
.lx, .lo { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-weight: 700; font-size: 0.9rem; line-height: 1; }
.lx { background: var(--x-soft); color: var(--x); transform: rotate(-6deg); }
.lo { background: var(--o-soft); color: var(--o); transform: rotate(5deg); }
.toolbar { display: flex; justify-content: center; gap: 10px; margin: 10px 0; }
.toolbar .icon-btn { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 2px 8px rgba(30, 40, 90, 0.08); }
.icon-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0; color: var(--ink); }
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.icon-btn.brand { background: var(--brand-soft); color: var(--brand); border-color: #d9dcff; }

.app { max-width: 760px; margin: 0 auto; padding: 10px 14px 24px; }

/* Thống kê */
.scores { display: flex; justify-content: center; gap: 6px; }
.chip { display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border: 1.5px solid transparent; border-radius: 999px; flex: none; }
.chip.x { background: var(--x-soft); color: #a3171b; }
.chip.o { background: var(--o-soft); color: #1d4ed8; }
.chip.d { background: #fff7e3; color: #8a5a06; }
.chip.on.x { border-color: var(--x); }
.chip.on.o { border-color: var(--o); }
.badge { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.7rem; color: #fff; flex: none; }
.chip.x .badge { background: var(--x); }
.chip.o .badge { background: var(--o); }
.chip.d .badge { background: var(--amber); }
.badge svg.i { width: 13px; height: 13px; stroke-width: 3; }
.nm { font-size: 0.72rem; font-weight: 500; white-space: nowrap; }
.cnt { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 0.88rem; }
.cnt svg.i { width: 14px; height: 14px; }
.msg { flex: 1; min-width: 0; text-align: left; font-weight: 500; font-size: 0.92rem; line-height: 1.3; }
.msg.end { font-weight: 600; }
.msg.win { color: #168a47; }
.msg.lose { color: var(--muted); }
.mark-x { color: var(--x); font-weight: 700; }
.mark-o { color: var(--o); font-weight: 700; }

/* Bàn cờ */
.board-card { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; border: 2px solid var(--grid-edge); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 28px rgba(79, 70, 229, 0.12); background: #fff; }
canvas#board { display: block; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
canvas#board.locked { cursor: default; }
.fit { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.92); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.fit[hidden] { display: none; }

/* Dock: zoom + đồng hồ tròn */
.dock { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.zoom { display: flex; gap: 8px; flex: none; }
.round-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 2px 8px rgba(30, 40, 90, 0.08); }
.round-btn:hover:not(:disabled) { background: var(--hover); }
.round-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.ring { position: relative; width: 54px; height: 54px; flex: none; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring .track { fill: none; stroke: #e8edf8; stroke-width: 7; }
.ring .prog { fill: none; stroke: #22c55e; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.2s linear, stroke 0.2s; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.ring.idle { opacity: 0.45; }
.ring.warn span { color: #ef4444; }

/* Hiệu ứng */
canvas#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 74px); transform: translateX(-50%); z-index: 60; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 10px 22px; font-weight: 600; font-size: 1.05rem; box-shadow: 0 10px 40px rgba(20, 30, 60, 0.2); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
}
@keyframes pop { from { transform: translateX(-50%) scale(0.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

/* Hộp thoại */
dialog { border: 0; padding: 0; border-radius: 18px; width: min(94vw, 460px); max-height: 88vh; overflow: hidden; color: var(--ink); background: #fff; box-shadow: 0 24px 70px rgba(20, 30, 60, 0.35); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(20, 30, 60, 0.5); }
.dlg-body { padding: 18px 18px 8px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.dlg-title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 1.1rem; font-weight: 600; }
.dlg-title svg.i { color: var(--brand); }
.dlg p.body { margin: 0 0 6px; color: var(--muted); }
.dlg-foot { flex: none; display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -8px 20px rgba(30, 40, 90, 0.06); }
.btn { border: 0; border-radius: 12px; padding: 11px 22px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #4f46e5, #2563eb); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3); }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.wide { width: 100%; }

/* Hộp xác nhận */
#confirmDlg { width: min(90vw, 340px); }
#confirmDlg .dlg-body { text-align: center; padding: 26px 22px 12px; }
#confirmDlg .dlg-title { justify-content: center; font-size: 1.2rem; margin-bottom: 6px; }
#confirmDlg p.body { font-size: 0.95rem; }
#confirmDlg .dlg-foot { border-top: 0; box-shadow: none; padding-top: 10px; }
#confirmDlg .btn { flex: 1; padding: 12px 10px; }
.cico { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #4f46e5, #2563eb); box-shadow: 0 0 0 8px rgba(79, 70, 229, 0.12), 0 10px 22px rgba(79, 70, 229, 0.3); }
.cico svg.i { width: 32px; height: 32px; stroke-width: 2.3; }
#confirmDlg[data-kind="undo"] .cico { background: linear-gradient(135deg, #fbbf24, #f97316); box-shadow: 0 0 0 8px rgba(249, 115, 22, 0.13), 0 10px 22px rgba(249, 115, 22, 0.32); }
#confirmDlg[data-kind="undo"] #cOk { background: linear-gradient(135deg, #f59e0b, #f97316); box-shadow: 0 6px 16px rgba(249, 115, 22, 0.32); }
#confirmDlg[data-kind="restart"] .cico { background: linear-gradient(135deg, #fb923c, #ef4444); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.12), 0 10px 22px rgba(239, 68, 68, 0.3); }
#confirmDlg[data-kind="restart"] #cOk { background: linear-gradient(135deg, #f97316, #ef4444); box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3); }
@media (prefers-reduced-motion: no-preference) {
  #confirmDlg[open] .cico { animation: cpop 0.45s cubic-bezier(0.2, 1.5, 0.4, 1); }
}
@keyframes cpop { from { transform: scale(0.5) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

/* Menu sau khi kết thúc ván */
#resultDlg { width: min(90vw, 340px); }
#resultDlg .dlg-body { text-align: center; padding: 28px 22px 10px; }
#resultDlg .dlg-title { justify-content: center; font-size: 1.3rem; margin-bottom: 6px; }
#resultDlg p.body { font-size: 0.88rem; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 4px; }
.st { position: relative; border-radius: 16px; padding: 12px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.st.x { background: var(--x-soft); }
.st.o { background: var(--o-soft); }
.st.d { background: #fff7e3; }
.st .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 4px 10px rgba(30, 40, 90, 0.18); }
.st .ic svg.i { width: 19px; height: 19px; stroke-width: 2.2; }
.st.x .ic { background: linear-gradient(135deg, #ff7b7b, #e5383b); }
.st.o .ic { background: linear-gradient(135deg, #6aa8ff, #2563eb); }
.st.d .ic { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.st .num { font-size: 1.6rem; font-weight: 700; line-height: 1; }
.st.x .num { color: #c2262a; }
.st.o .num { color: #1d4ed8; }
.st.d .num { color: #b7791f; }
.st .lbl { font-size: 0.72rem; font-weight: 500; color: var(--muted); }
.st.win.x { box-shadow: 0 0 0 2px var(--x); }
.st.win.o { box-shadow: 0 0 0 2px var(--o); }
.st.win.d { box-shadow: 0 0 0 2px var(--amber); }
.st .plus { position: absolute; top: -9px; right: -5px; background: #22c55e; color: #fff; font-weight: 700; font-size: 0.74rem; padding: 2px 8px; border-radius: 999px; box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4); }
.minis { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.mini { display: inline-flex; align-items: center; gap: 6px; background: var(--hover); border-radius: 999px; padding: 4px 11px 4px 4px; font-size: 0.78rem; color: var(--muted); }
.mini b { color: var(--ink); font-weight: 700; margin-right: -2px; }
.mini i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; }
.mini i svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
.mini.m i { background: #8b5cf6; }
.mini.g i { background: #14b8a6; }
.mini.r i { background: #22c55e; }
@media (prefers-reduced-motion: no-preference) {
  #resultDlg[open] .st .plus { animation: cpop 0.5s 0.25s cubic-bezier(0.2, 1.5, 0.4, 1) backwards; }
  #resultDlg[open] .st { animation: cpop 0.4s backwards; }
}
#resultDlg .dlg-foot { border-top: 0; box-shadow: none; flex-direction: column; padding-top: 8px; }
#resultDlg .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 10px; }
#resultDlg[data-kind="win"] .cico { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.15), 0 10px 22px rgba(245, 158, 11, 0.35); }
#resultDlg[data-kind="lose"] .cico { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 0 0 8px rgba(100, 116, 139, 0.14), 0 10px 22px rgba(100, 116, 139, 0.3); }
@media (prefers-reduced-motion: no-preference) {
  #resultDlg[open] .cico { animation: cpop 0.45s cubic-bezier(0.2, 1.5, 0.4, 1); }
}

/* Popup bắt đầu */
#startDlg { width: min(90vw, 360px); }
.start { text-align: center; padding: 26px 22px 24px; }
.logo-big { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
.logo-big .name { font-size: 2.4rem; }
.logo-big .lx, .logo-big .lo { width: 36px; height: 36px; font-size: 1.4rem; border-radius: 10px; }
.start .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.92rem; }
.big { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 14px; font-weight: 600; font-size: 1.05rem; border: 0; margin-bottom: 10px; }
.big.primary { color: #fff; background: linear-gradient(135deg, #4f46e5, #2563eb); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.32); }
.big.soft { color: var(--brand); background: var(--brand-soft); }
.langrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; color: var(--muted); }
.pills { display: flex; background: var(--hover); border-radius: 12px; padding: 3px; gap: 3px; }
.pills button { border: 0; background: transparent; border-radius: 9px; padding: 7px 14px; font-weight: 500; font-size: 0.88rem; }
.pills button[aria-pressed="true"] { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 1px 6px rgba(30, 40, 90, 0.15); }

/* Cài đặt dạng icon */
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 10px; }
.row[hidden] { display: none; }
.rlab { font-size: 0.78rem; color: var(--muted); line-height: 1.25; }
.tiles { display: flex; gap: 6px; }
.tile { flex: 1; min-width: 0; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 2px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; color: var(--muted); }
.tile:hover { background: var(--hover); }
.tile .cap { font-size: 0.68rem; font-weight: 500; line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .bigtxt { font-size: 1.15rem; font-weight: 700; line-height: 1; }
.tile svg.i { width: 22px; height: 22px; }
.tile svg.wide { width: 36px; height: 18px; }
.tile[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.tile[aria-pressed="true"] .cap { font-weight: 600; }
.notes { border-top: 1px solid var(--line); margin-top: 4px; padding: 10px 0 6px; }
.notes p { margin: 0 0 6px; font-size: 0.78rem; color: var(--muted); }
.notes strong { color: var(--ink); font-weight: 600; }

@media (max-width: 560px) {
  #settingsDlg { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 90vh; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo">
      <span class="name" data-i18n="title">Cờ Caro</span><span class="lx">X</span><span class="lo">O</span>
    </div>
  </div>
</header>

<div class="app" id="wrap">
  <div class="scores">
    <div class="chip x" id="chipX"><span class="badge">X</span><span class="nm" id="nX"></span><span class="cnt"><span data-icon="trophy"></span><b id="cX">0</b></span></div>
    <div class="chip o" id="chipO"><span class="badge">O</span><span class="nm" id="nO"></span><span class="cnt"><span data-icon="trophy"></span><b id="cO">0</b></span></div>
    <div class="chip d"><span class="badge" data-icon="equals"></span><span class="nm" data-i18n="drawLbl">Hòa</span><span class="cnt"><b id="cD">0</b></span></div>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="soundBtn" type="button"></button>
    <button class="icon-btn" id="undoBtn" type="button" data-icon="undo" data-i18n-title="undo"></button>
    <button class="icon-btn" id="newBtn" type="button" data-icon="newg" data-i18n-title="newGame"></button>
    <button class="icon-btn brand" id="settingsBtn" type="button" data-icon="gear" data-i18n-title="settings"></button>
  </div>

  <div class="board-card" id="card">
    <canvas id="board" aria-label="Caro"></canvas>
    <button class="fit" id="fitBtn" type="button" data-icon="fit" data-i18n-title="fit" hidden></button>
  </div>

  <div class="dock">
    <div class="ring" id="ring">
      <svg viewBox="0 0 76 76" aria-hidden="true">
        <circle class="track" cx="38" cy="38" r="31"/>
        <circle class="prog" id="prog" cx="38" cy="38" r="31" transform="rotate(-90 38 38)" stroke-dasharray="194.8" stroke-dashoffset="0"/>
      </svg>
      <span id="tsec">60</span>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="zoom">
      <button class="round-btn" id="zoomOut" type="button" data-icon="minus" data-i18n-title="zoomOut"></button>
      <button class="round-btn" id="zoomIn" type="button" data-icon="plus" data-i18n-title="zoomIn"></button>
    </div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>

<!-- Popup bắt đầu -->
<dialog id="startDlg" aria-labelledby="startTitle">
  <div class="start">
    <div class="logo-big" id="startTitle"><span class="name" data-i18n="title">Cờ Caro</span><span class="lx">X</span><span class="lo">O</span></div>
    <p class="sub" data-i18n="startSub">Ai xếp được 5 quân liên tiếp trước sẽ thắng</p>
    <button class="big primary" id="playBtn" type="button"><span data-icon="play"></span><span data-i18n="play">Chơi</span></button>
    <button class="big soft" id="startSettingsBtn" type="button"><span data-icon="gear"></span><span data-i18n="settings">Cài đặt</span></button>
    <div class="langrow">
      <span data-icon="globe"></span>
      <div class="pills" id="startLang">
        <button type="button" data-lang="vi">Tiếng Việt</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
  </div>
</dialog>

<!-- Modal cài đặt: chỉ có nút OK cố định ở đáy -->
<dialog id="settingsDlg" aria-labelledby="sTitle">
  <div class="dlg-body">
    <h2 class="dlg-title" id="sTitle"><span data-icon="gear"></span><span data-i18n="settings">Cài đặt</span></h2>
    <div id="sRows"></div>
    <div class="notes">
      <p id="ruleNote"></p>
      <p data-i18n="timerNote"></p>
      <p data-i18n="restartNote"></p>
    </div>
  </div>
  <div class="dlg-foot">
    <button class="btn wide" id="sOk" type="button">OK</button>
  </div>
</dialog>

<!-- Menu kết thúc ván -->
<dialog id="resultDlg" aria-labelledby="rTitle">
  <div class="dlg-body">
    <div class="cico" id="rIco"></div>
    <h2 class="dlg-title" id="rTitle"></h2>
    <div class="stats" id="rStats"></div>
    <div class="minis" id="rMinis"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="rReplay" type="button"><span data-icon="newg"></span><span data-i18n="replay">Chơi lại</span></button>
    <button class="btn ghost" id="rSettings" type="button"><span data-icon="gear"></span><span data-i18n="settings">Cài đặt</span></button>
  </div>
</dialog>

<!-- Modal xác nhận -->
<dialog id="confirmDlg" aria-labelledby="cTitle">
  <div class="dlg-body dlg">
    <div class="cico" id="cIco"></div>
    <h2 class="dlg-title" id="cTitle"></h2>
    <p class="body" id="cBody"></p>
  </div>
  <div class="dlg-foot">

        var ns = pinchState();
        zoomBy(ns.d / pinch.d, ns.mx, ns.my);
        view.x += ns.mx - pinch.mx; view.y += ns.my - pinch.my;
        clampView();
        pinch = ns;
        draw(); updateZoomUI();
        return;
      }
      if (nptr === 1 && g) {
        var dx = p.x - g.sx, dy = p.y - g.sy;
        if (!g.moved && Math.hypot(dx, dy) > 6 && Wd * view.s > S + 1) g.moved = true;
        if (g.moved) { view.x = g.vx + dx; view.y = g.vy + dy; clampView(); draw(); }
      }
    }
    if (e.pointerType === "mouse") {
      var h = cellAt(p);
      if ((h && (!hover || hover.r !== h.r || hover.c !== h.c)) || (!h && hover)) { hover = h; draw(); }
    }
  });
  function endPtr(e, cancelled) {
    if (!ptrs[e.pointerId]) return;
    var p = loc(e);
    delete ptrs[e.pointerId];
    nptr = Object.keys(ptrs).length;
    pinch = null;
    if (nptr === 0) {
      if (g && !g.moved && !g.multi && !cancelled) tap(p);
      g = null;
    } else if (nptr === 1) {
      var rp = ptrs[Object.keys(ptrs)[0]];
      g = { sx: rp.x, sy: rp.y, vx: view.x, vy: view.y, moved: true, multi: true };
    }
  }
  cv.addEventListener("pointerup", function (e) { endPtr(e, false); });
  cv.addEventListener("pointercancel", function (e) { endPtr(e, true); });
  cv.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse" && hover) { hover = null; draw(); } });
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var p = loc(e);
    zoomAt(Math.exp(-e.deltaY * 0.0015), p.x, p.y);
  }, { passive: false });
  $("zoomIn").addEventListener("click", function () { zoomAt(1.35, S / 2, S / 2); });
  $("zoomOut").addEventListener("click", function () { zoomAt(1 / 1.35, S / 2, S / 2); });
  $("fitBtn").addEventListener("click", function () {
    // Bàn lớn: chuyển qua lại giữa xem toàn bàn và cỡ ô chuẩn
    if (minS() < 0.999 && view.s > minS() + 0.01) { view.s = minS(); view.x = (S - Wd * view.s) / 2; view.y = view.x; clampView(); }
    else resetView();
    draw(); updateZoomUI();
  });

  // ---------- Hộp thoại ----------
  var settingsDlg = $("settingsDlg"), confirmDlg = $("confirmDlg"), startDlg = $("startDlg"), draft = null, confirmCb = null;

  function ask(title, body, okLabel, cb, kind) {
    kind = kind || "new";
    confirmDlg.setAttribute("data-kind", kind);
    $("cIco").innerHTML = ICONS[kind === "undo" ? "undo" : (kind === "new" ? "newg" : "warn")];
    $("cTitle").textContent = title;
    $("cBody").textContent = body;
    $("cOk").textContent = okLabel;
    confirmCb = cb;
    confirmDlg.showModal();
  }
  $("cOk").addEventListener("click", function () {
    var cb = confirmCb; confirmCb = null;
    confirmDlg.close();
    if (cb) cb();
  });
  $("cCancel").addEventListener("click", function () { confirmCb = null; confirmDlg.close(); });
  confirmDlg.addEventListener("close", function () { confirmCb = null; setTimeout(showResultMenu, 0); });

  // Các nhóm cài đặt dạng ô icon
  var GROUPS = [
    { key: "lang", lab: "gLang", opts: [{ v: "vi", ico: '<span class="bigtxt">VI</span>', cap: "Tiếng Việt" }, { v: "en", ico: '<span class="bigtxt">EN</span>', cap: "English" }] },
    { key: "mode", lab: "gMode", opts: [{ v: "ai", ico: ICONS.robot, cap: "mAi", i: 1 }, { v: "pvp", ico: ICONS.users, cap: "mPvp", i: 1 }] },
    { key: "level", lab: "gLevel", ai: 1, opts: [{ v: "easy", ico: bars(1), cap: "lEasy", i: 1 }, { v: "medium", ico: bars(2), cap: "lMed", i: 1 }, { v: "hard", ico: bars(3), cap: "lHard", i: 1 }] },
    { key: "first", lab: "gFirst", ai: 1, opts: [{ v: "human", ico: ICONS.user, cap: "fHuman", i: 1 }, { v: "ai", ico: ICONS.robot, cap: "fAi", i: 1 }] },
    { key: "block", lab: "gBlock", opts: [{ v: "on", ico: blockIcon(true), cap: "bOn", i: 1 }, { v: "off", ico: blockIcon(false), cap: "bOff", i: 1 }] },
    { key: "timer", lab: "gTimer", opts: [{ v: "30", ico: '<span class="bigtxt">30</span>', cap: "t30", i: 1 }, { v: "60", ico: '<span class="bigtxt">60</span>', cap: "t60", i: 1 }, { v: "0", ico: '<span class="bigtxt">∞</span>', cap: "t0", i: 1 }] },
    { key: "sound", lab: "gSound", opts: [{ v: "on", ico: ICONS.sound, cap: "sOn", i: 1 }, { v: "off", ico: ICONS.mute, cap: "sOff", i: 1 }] },
    { key: "size", lab: "gSize", opts: [{ v: "15", ico: gridIcon(4), cap: "15×15" }, { v: "20", ico: gridIcon(5), cap: "20×20" }, { v: "25", ico: gridIcon(6), cap: "25×25" }] }
  ];
  (function buildSettings() {
    var host = $("sRows");
    for (var gi = 0; gi < GROUPS.length; gi++) {
      var gr = GROUPS[gi], row = document.createElement("div");
      row.className = "row"; row.setAttribute("data-key", gr.key);
      if (gr.ai) row.setAttribute("data-ai", "1");
      var lab = document.createElement("span");
      lab.className = "rlab"; lab.setAttribute("data-i18n", gr.lab);
      var tiles = document.createElement("div");
      tiles.className = "tiles";
      for (var oi = 0; oi < gr.opts.length; oi++) {
        var o = gr.opts[oi], b = document.createElement("button");
        b.type = "button"; b.className = "tile"; b.setAttribute("data-val", o.v);
        b.innerHTML = o.ico + '<span class="cap"' + (o.i ? ' data-i18n="' + o.cap + '"' : "") + ">" + (o.i ? "" : o.cap) + "</span>";
        tiles.appendChild(b);
      }
      row.appendChild(lab); row.appendChild(tiles);
      host.appendChild(row);
    }
  })();

  function syncSettings() {
    var rows = $("sRows").querySelectorAll(".row");
    for (var g = 0; g < rows.length; g++) {
      var key = rows[g].getAttribute("data-key");
      var btns = rows[g].querySelectorAll(".tile");
      for (var b = 0; b < btns.length; b++) {
        btns[b].setAttribute("aria-pressed", btns[b].getAttribute("data-val") === draft[key] ? "true" : "false");
      }
      if (rows[g].getAttribute("data-ai")) rows[g].hidden = draft.mode !== "ai";
    }
    var lg = LANG[draft.lang] || LANG.vi;
    $("ruleNote").innerHTML = draft.block === "on" ? lg.ruleOn : lg.ruleOff;
  }
  function openSettings() {
    draft = {};
    for (var k in settings) draft[k] = settings[k];
    syncSettings();
    settingsDlg.showModal();
  }
  settingsDlg.addEventListener("click", function (e) {
    if (e.target === settingsDlg) { applySettings(); return; }
    var btn = e.target.closest ? e.target.closest(".tile") : null;
    if (!btn) return;
    draft[btn.parentNode.parentNode.getAttribute("data-key")] = btn.getAttribute("data-val");
    syncSettings();
  });
  settingsDlg.addEventListener("cancel", function (e) { e.preventDefault(); applySettings(); });
  $("sOk").addEventListener("click", applySettings);

  function applySettings() {
    if (!settingsDlg.open || !draft) return;
    var restartKeys = ["mode", "first", "block", "size"], needs = false, i;
    for (i = 0; i < restartKeys.length; i++) if (draft[restartKeys[i]] !== settings[restartKeys[i]]) needs = true;
    var d = draft;
    function commit() {
      var resetScore = d.mode !== settings.mode || d.first !== settings.first;
      for (var k in d) settings[k] = d[k];
      if (resetScore) { scores = { 1: 0, 2: 0, d: 0 }; startFresh = true; }
      saveSettings();
      applyLang();
      if (needs) newGame();
      else { resetTurnTimer(); updateUI(); draw(); showResultMenu(); }
    }
    settingsDlg.close();
    draft = null;
    if (needs && started && moves.length > 0 && !over) ask(t("restartTitle"), t("restartBody"), t("restartOk"), commit, "restart");
    else commit();
  }

  // ---------- Menu kết thúc ván ----------
  var resultDlg = $("resultDlg"), menuReady = false;
  function showResultMenu() {
    if (!menuReady || !over || !started || resultDlg.open || document.querySelector("dialog[open]")) return;
    var kind = result === "d" ? "draw" : (aiOn() ? (result === humanP() ? "win" : "lose") : "win");
    resultDlg.setAttribute("data-kind", kind);
    $("rIco").innerHTML = ICONS[kind === "win" ? "trophy" : (kind === "lose" ? "sad" : "equals")];
    $("rTitle").textContent = result === "d" ? t("draw") : (aiOn() ? (kind === "win" ? t("winYou") : t("loseYou")) : t("winP", { who: whoName(result) }));
    var sn = function (p) { return aiOn() ? whoName(p) : "P" + p; };
    function tile(cls, icon, num, lbl, plus) {
      return '<div class="st ' + cls + (plus ? " win" : "") + '">' + (plus ? '<span class="plus">+1</span>' : "") +
        '<span class="ic">' + icon + '</span><span class="num">' + num + '</span><span class="lbl">' + lbl + "</span></div>";
    }
    $("rStats").innerHTML = tile("x", ICONS.trophy, scores[1], sn(1), result === 1) +
      tile("o", ICONS.trophy, scores[2], sn(2), result === 2) +
      tile("d", ICONS.equals, scores.d, t("drawLbl"), result === "d");
    var total = scores[1] + scores[2] + scores.d;
    var minis = '<span class="mini m"><i>' + ICONS.target + "</i><b>" + moves.length + "</b> " + t("moves") + "</span>" +
      '<span class="mini g"><i>' + ICONS.hash + "</i><b>" + total + "</b> " + t("games") + "</span>";
    if (aiOn()) minis += '<span class="mini r"><i>' + ICONS.percent + "</i><b>" + Math.round(scores[humanP()] / Math.max(1, total) * 100) + "%</b> " + t("rate") + "</span>";
    $("rMinis").innerHTML = minis;
    resultDlg.showModal();
  }
  resultDlg.addEventListener("cancel", function (e) { e.preventDefault(); });
  $("rReplay").addEventListener("click", function () { resultDlg.close(); newGame(); });
  $("rSettings").addEventListener("click", function () { resultDlg.close(); openSettings(); });

  // ---------- Popup bắt đầu ----------
  startDlg.addEventListener("cancel", function (e) { e.preventDefault(); });
  $("playBtn").addEventListener("click", function () {
    ac();
    started = true;
    startDlg.close();
    resetTurnTimer();
    updateUI();
    draw();
    maybeAI();
  });
  $("startSettingsBtn").addEventListener("click", openSettings);
  $("startLang").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    settings.lang = b.getAttribute("data-lang");
    saveSettings();
    applyLang();
  });

  // ---------- Nút trên header ----------
  $("undoBtn").addEventListener("click", function () {
    if (!moves.length) return;
    ask(t("undoTitle"), aiOn() ? t("undoBodyAi") : t("undoBody"), t("undoOk"), undo, "undo");
  });
  $("newBtn").addEventListener("click", function () {
    ask(t("newTitle"), (over || !moves.length) ? t("newBodyDone") : t("newBody"), t("newOk"), newGame, "new");
  });
  $("settingsBtn").addEventListener("click", openSettings);
  $("soundBtn").addEventListener("click", function () {
    settings.sound = soundOn() ? "off" : "on";
    saveSettings();
    updateUI();
    if (soundOn()) { ac(); sndMove(1); }
  });

  function relayout() {
    if (!board) return;
    var ns = calcS();
    if (Math.abs(ns - S) > 1) { sizeCanvas(); draw(); updateZoomUI(); }
    if (fx) sizeFx();
  }
  window.addEventListener("resize", relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe($("wrap"));

  // ---------- Khởi động ----------
  fillIcons(document);
  applyLang();
  fillIcons(document);
  newGame();
  startDlg.showModal();
})();
</script>
</body>
</html>
